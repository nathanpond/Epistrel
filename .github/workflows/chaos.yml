# The weekly chaos run (#75, docs/04 §12): every `chaos` test at full strength, i.e. 500
# iterations (EPISTREL_CHAOS_ITERATIONS) and 3 database outages for X-06. PR CI (ci.yml) runs only
# the `chaos_quick` subset, at each test's quick default. This workflow gates nothing: it reports
# in the step summary, uploads the log, and on a red run opens (or comments on) a
# "Weekly chaos run failed" issue.
name: Chaos

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      seed:
        description: EPISTREL_CHAOS_SEED to rerun with, which repeats each seeded test's random draws but not X-04's timing (empty draws a fresh one; each seeded test prints its seed)
        type: string
        required: false
        default: ""
      iterations:
        description: EPISTREL_CHAOS_ITERATIONS
        type: string
        required: false
        default: "500"

permissions:
  contents: read

# One chaos run at a time; a run in progress is never cancelled (its issue step must run).
concurrency:
  group: chaos
  cancel-in-progress: false

env:
  # The gate's uv (ci.yml), so the chaos run tests the toolchain the merge gate uses.
  UV_VERSION: "0.12.23"

jobs:
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2  # exact: setup-uv publishes no floating major tag past v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen
      # Integration fixtures start pgvector/pgvector:pg16 through testcontainers on the runner's
      # Docker; X-06 starts (and kills) a second container of its own.
      - name: Chaos suite
        id: chaos
        env:
          EPISTREL_CHAOS_ITERATIONS: ${{ inputs.iterations || '500' }}
          EPISTREL_CHAOS_SEED: ${{ inputs.seed || '' }}
          EPISTREL_CHAOS_DISRUPTIONS: "3"
        run: |
          mkdir -p build/chaos
          set -o pipefail
          uv run pytest -m chaos -s -rA --junitxml=build/chaos/junit.xml 2>&1 | tee build/chaos/chaos.log
      # The greps below anchor on `^X-0n`: each chaos test prints its seed line starting with a
      # newline, so the line stands alone even under `-s`, where pytest writes the test file's path
      # or the progress dots ahead of a test's first print (#309). The anchor also keeps a failed
      # test's traceback source lines (`    print(f"X-03 seed={SEED} ...")`) out of the summary.
      - name: Summarise
        if: always()
        env:
          OUTCOME: ${{ steps.chaos.outcome }}
        run: |
          {
            printf '%s\n' "## Weekly chaos run: $OUTCOME" '' 'Seeds and tallies (rerun a seed with the `seed` input):' '' '```'
            grep -E '^X-0[0-9] ' build/chaos/chaos.log || printf '%s\n' '(no tallies printed)'
            printf '%s\n' '```' '' '```'
            grep -E '^(FAILED|ERROR|PASSED) |[0-9]+ (passed|failed)' build/chaos/chaos.log | tail -40 || true
            printf '%s\n' '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: chaos-log
          path: build/chaos/
          if-no-files-found: warn
      - name: Report a red run
        if: failure() && steps.chaos.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed=$(grep -E '^(FAILED|ERROR) ' build/chaos/chaos.log | head -20 || true)
          seeds=$(grep -E '^X-0[0-9]( [a-z-]+)? seed=[0-9]' build/chaos/chaos.log || true)
          body=$(printf '%s\n' "The weekly chaos run failed: $RUN_URL" '' 'Failed:' '```' "$failed" '```' '' 'Seeds (rerun one with the workflow'"'"'s `seed` input):' '```' "$seeds" '```')
          open=$(gh issue list --state open --search 'in:title "Weekly chaos run failed"' --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "Weekly chaos run failed $(date -u +%F)" --label bug --label needs-triage --body "$body"
          fi
