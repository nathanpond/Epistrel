[project]
name = "epistrel"
version = "0.1.1"
description = "A viewpoint-aware memory engine for character/actor GenAI"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14",
    "boto3>=1.43.112",
    "cryptography>=50.0.2",
    "fastapi>=0.115",
    "httpx2>=2.13.1",
    "jinja2>=3.1.6",
    "openai>=3.39.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "pillow>=12.3.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.112",
    "hypothesis>=6.168.5",
    "import-linter>=2",
    "mypy>=1.13",
    "pip-licenses>=5.5",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-benchmark>=5.3.0",
    "pytest-cov>=6",
    "pyyaml>=6",
    "ruff>=0.8",
    "schemathesis>=4.28.0",
    "testcontainers[postgres]>=4",
    "types-pyyaml>=6.0.12.20260906",
]
perf = [
    "locust>=2.46.7",
]

[project.scripts]
epistrel = "epistrel.cli:main"

[tool.epistrel.gates]
# highest verified milestone; bumped in the PR that closes each milestone
current_milestone = 5

[tool.epistrel.gates.deny]
# Checked by `python -m tools.gates check-deps` over the runtime closure of uv.lock (dev groups exempt).
# Invariant 1 — Epistrel runs no model of its own: no inference runtime or model-weights package.
model_runtimes = [
    "torch", "tensorflow", "jax", "transformers", "vllm", "llama-cpp-python",
    "onnxruntime", "ctransformers", "sentence-transformers",
]
# Invariant 5 — no external broker, cache, or scheduler: no client library for one.
infra = [
    "redis", "celery", "rq", "dramatiq", "kombu", "pika", "aio-pika", "apscheduler", "huey", "arq",
    "aiocache", "pymemcache", "kafka-python", "aiokafka", "nats-py",
]

[tool.epistrel.gates.licenses]
# Invariant 2 — Apache-2.0-compatible dependency graph. Checked by `python -m tools.gates check-licenses`
# over the runtime closure (dev groups exempt). `OR` passes when any branch is allowed; `AND` needs all.
allow = [
    "Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "PSF-2.0", "Python-2.0", "0BSD",
    "Zlib", "Unlicense", "MPL-2.0",
    # Pillow (#105): the Historical Permission Notice and Disclaimer family; Pillow 12 declares
    # MIT-CMU, earlier releases HPND. Both are permissive, OSI-approved and Apache-2.0-compatible.
    "MIT-CMU", "HPND",
    # LGPL: acceptable for libraries used unmodified through their public API (invariant 2, amended
    # 2026-10-08 for psycopg 3). Modifying or vendoring an LGPL library is still out.
    "LGPL-2.1-only", "LGPL-2.1-or-later", "LGPL-3.0-only", "LGPL-3.0-or-later",
]
# Families reported as "denied" rather than "not allowed"; an exception can never admit one of these.
deny = ["GPL", "AGPL", "SSPL", "EUPL"]
# package = "one-line rationale"; admits a not-allowed or UNKNOWN license, never a denied family.
exceptions = { cffi = "MIT-0 (MIT without the attribution clause; permissive like the allowed 0BSD and Unlicense); runtime dependency of cryptography, used unmodified (#51)" }

[tool.importlinter]
# docs/02 layering — Core is the deterministic layer; not a project invariant (an ordinary PR may relax it).
root_package = "epistrel"

[[tool.importlinter.contracts]]
name = "core-does-not-import-orchestrator-or-api"
type = "forbidden"
source_modules = ["epistrel.core"]
forbidden_modules = ["epistrel.orchestrator", "epistrel.api"]

[[tool.importlinter.contracts]]
# FR-PROP-6,9, FR-RET-2 (#139): resolution never calls a model. Nothing in `epistrel.core.resolution`
# reaches the Model Access Layer (the Orchestrator), the Engine or the API, directly or through
# another module; `tests/test_resolution.py` also runs the resolvers with a stub adapter that fails
# on any call.
name = "resolution-calls-no-model"
type = "forbidden"
source_modules = ["epistrel.core.resolution"]
forbidden_modules = ["epistrel.orchestrator", "epistrel.engine", "epistrel.api"]

[[tool.importlinter.contracts]]
# #74: `epistrel.core` imports `epistrel.observability` (the telemetry scope and spans), so
# observability must not reach the orchestrator, the API or the Engine, or core would through it.
name = "observability-is-below-orchestrator-and-api"
type = "forbidden"
source_modules = ["epistrel.observability"]
forbidden_modules = ["epistrel.orchestrator", "epistrel.api", "epistrel.engine"]

[[tool.importlinter.contracts]]
# FR-GUARD-1, NFR-SEC-1 (#49): nothing on the turn path or the event store reaches the policy
# store's only write path; `tests/test_u_13.py` also checks that `epistrel.engine` is its only importer.
name = "policy-store-written-only-by-admin"
type = "forbidden"
source_modules = [
    "epistrel.orchestrator.lite",
    "epistrel.orchestrator.structured",
    "epistrel.core.events",
    "epistrel.orchestrator.policies.store",
]
forbidden_modules = ["epistrel.orchestrator.policies.admin"]

[[tool.importlinter.contracts]]
# FR-RATE-8 (#121): the rating suggestion is advisory. No guardrail (the deterministic evaluator
# and the Orchestrator's gates), catalog/publish, story-creation or rating-change code reads it,
# directly or through another module; `tests/gates/test_rating_suggestion_contract.py` checks
# that the contract exists and is kept.
name = "rating-suggestion-is-advisory"
type = "forbidden"
source_modules = [
    "epistrel.core.policies",
    "epistrel.orchestrator.policies",
    "epistrel.core.catalog",
    "epistrel.core.genesis",
    "epistrel.core.ratings.change",
]
forbidden_modules = ["epistrel.core.ratings.suggest", "epistrel.orchestrator.ratings.suggest"]

[[tool.importlinter.contracts]]
# FR-FB-3 (#126): feedback is flag-only. Nothing that plays a turn (the Orchestrator, the Lite
# pipeline and its jobs), creates a story, runs a guardrail (`core.policies`, and the
# Orchestrator's gates), changes a rating, resolves a profile or folds a projection reads
# feedback, its reports or its exports, directly or through another module. The two ignored
# edges are erasure's (#123, #124): it reads a rating's text to index and redact the subjects it
# names (FR-ADMIN-6), which changes nothing in a turn. `tests/gates/test_feedback_contract.py`
# checks that the contract exists as written, is kept and bites.
name = "feedback-is-flag-only"
type = "forbidden"
source_modules = [
    "epistrel.orchestrator",
    "epistrel.core.genesis",
    "epistrel.core.policies",
    "epistrel.core.ratings",
    "epistrel.core.profiles",
    "epistrel.core.projections",
]
forbidden_modules = [
    "epistrel.core.feedback",
    "epistrel.core.feedback_reporting",
    "epistrel.core.feedback_export",
]
ignore_imports = [
    "epistrel.core.erasure.records -> epistrel.core.feedback",
    "epistrel.core.erasure.erase -> epistrel.core.feedback",
]

[[tool.importlinter.contracts]]
# NFR-QUAL-8 (#134): the eval harness never runs in a turn. Nothing in the engine (Core, the
# Orchestrator, the API, the Engine, observability) imports `epistrel.evals`, directly or through
# another module; the harness may import any of them (it drives the in-process Engine).
name = "nothing-in-the-engine-imports-the-eval-harness"
type = "forbidden"
source_modules = [
    "epistrel.core",
    "epistrel.orchestrator",
    "epistrel.api",
    "epistrel.engine",
    "epistrel.observability",
]
forbidden_modules = ["epistrel.evals"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epistrel"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "tools", "perf"]
extend-exclude = ["tests/gates/fixtures"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PT"]
# The erasure matcher folds Turkish dotless ı to i (ADR-156), so its code, docs and tests name it.
allowed-confusables = ["ı"]

[tool.ruff.lint.per-file-ignores]
# S101: pytest's plain `assert` is the assertion mechanism in tests.
# S603: tests launch the CLI as a subprocess with a fixed, non-user-controlled argv.
# S105/S106: testcontainers' default test/test credentials appear literally in fixtures.
"tests/**" = ["S101", "S603", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests", "migrations", "tools", "perf"]
exclude = ["^tests/gates/fixtures/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# The `perf` dependency group (#76: P-04's Locust driver) is installed only for the workload run,
# so the gate's mypy may not see it.
module = ["locust", "locust.*", "gevent", "gevent.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Without the `perf` group, Locust is `Any`: the driver still subclasses `User` and uses `@task`.
module = ["perf.lite_smoke.locustfile"]
disallow_subclassing_any = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs PostgreSQL (Docker via testcontainers, or EPISTREL_TEST_DATABASE_URL)",
    "redteam: red-team suite (docs/04 §10, R-xx); runs in PR CI with everything else",
    "redteam_long: the full red-team corpora (R-01's 20 poisoning sequences; #145); deselected unless -m names the marker, run nightly by redteam.yml. PR CI runs the `redteam` subset",
    "live_model: needs a real OpenAI-compatible endpoint (EPISTREL_LIVE_BASE_URL/_MODEL/_API_KEY); deselected unless -m names it, and fails when those are unset (#54)",
    "chaos: chaos suite (docs/04 §12, X-xx); every test under tests/chaos/ (auto-marked). PR CI runs only the chaos_quick ones, at their default EPISTREL_CHAOS_ITERATIONS; the weekly chaos.yml runs them all at 500 (#75)",
    "chaos_quick: the chaos tests PR CI runs (quick at their default iteration count; #75)",
    "perf_quick: the performance tests PR CI runs (P-03's quick subset; #76); the nightly perf.yml runs them with the perf_long ones",
    "perf_long: long performance tests (P-03 on the 20,000-event reference story; #76); deselected unless -m names the marker, run nightly by perf.yml. P-04's reference workload itself is `python -m perf.lite_smoke`, not a test",
    "smoke: the deployment smoke (C-10, #77): every test under tests/smoke/ (auto-marked), run against a live compose stack at EPISTREL_SMOKE_BASE_URL; deselected unless -m names it, and fails when that is unset. publish-edge.yml and release.yml run it before publishing",
    "perf_weekly: the weekly performance suite on the scale fixture (P-01, P-02, P-06 on 50k memories / 100k events; #153); deselected unless -m names the marker, run by perf.yml's weekly job on the GitHub-hosted runner. The only tests that assert wall-clock budgets of NFR-PERF-1,2 and NFR-SCALE-1",
    "perf_capacity: P-10's capacity exploration (250k, 1M, 5M memories; NFR-SCALE-1, informational and never a gate; #498); deselected unless -m names the marker, run by hand only (no workflow names it), its results committed under perf/results/",
    "perf_smoke: the scale suite's plumbing on the 1k fixture (#153), run by PR CI with everything else; asserts no wall-clock bound (#430, #432)",
    "soak: long-horizon soak tests (docs/04 §12, X-01's 20,000 turns; #147); deselected unless -m names the marker, run weekly by soak.yml",
    "part(milestone, requirements, interim_until=None): milestone part (docs/04 §13) — gates from <milestone>, covers <requirements>; see tests/README.md",
]
# tests/gates/fixtures holds deliberately broken test trees for the gate checks; pytest must not collect them.
norecursedirs = ["tests/gates/fixtures", ".*", "build", "dist", "node_modules", "venv", ".venv"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
branch = true
source = ["epistrel"]
# The eval harness (#134) is measured by its own runs, not by the core coverage gate.
omit = ["tools/*", "*/epistrel/evals/*"]

[tool.coverage.report]
# fail_under is deliberately not set here: the gate passes `--cov-fail-under=90` explicitly for
# epistrel.core (see .github/workflows/ci.yml and README), so a plain `uv run pytest` stays quick.
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
