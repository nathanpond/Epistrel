# Dev/hobby deployment (docs/02 §12, NFR-OPS-1,2): `docker compose up` brings up the Engine and
# PostgreSQL 16 + pgvector with no prior configuration. The engine runs in `all` mode: the API and
# the background workers that own every timer and sweep, in one process, so no scheduler, cron,
# broker or cache service exists here. Tear down with `docker compose down -v`.
name: epistrel

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: epistrel
      POSTGRES_PASSWORD: epistrel-dev  # dev-only default — override EPISTREL_DATABASE_URL for anything but local use
      POSTGRES_DB: epistrel
    ports:
      - "127.0.0.1:5432:5432"  # local tools (psql, IDE) on the host
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epistrel -d epistrel"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  engine:
    build: .
    image: epistrel:dev
    command: ["serve", "--mode", "all"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Literal, not ${...}: a developer's .env with a localhost URL must never reach the container.
      EPISTREL_DATABASE_URL: postgresql+psycopg://epistrel:epistrel-dev@db:5432/epistrel
      EPISTREL_LOG_LEVEL: INFO
      EPISTREL_SERVICE_CREDENTIALS: dev-only-credential-change-me-00000000  # dev-only default — override for anything but local use
      EPISTREL_CONFIG_KEY: ZXBpc3RyZWwtZGV2LW9ubHktY29uZmlnLWtleS0wMDA=  # dev-only default — override for anything but local use
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media:/var/lib/epistrel/media  # the local blob store (EPISTREL_MEDIA_ROOT, #105)
    extra_hosts:
      - "host.docker.internal:host-gateway"  # a host-run model server (LM Studio) is reachable from the container

volumes:
  pgdata:
  media:
