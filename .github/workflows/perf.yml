# The nightly performance run (#76, docs/04 §11): P-03's turn-commit latency on the reference
# story (20,000 events, 1,000 commits; `perf_long`) and its quick subset (`perf_quick`, which PR CI
# also runs). P-03 gates itself (p95 <= 250 ms, no commit over 2 s), so a regression turns this
# run red; the run reports in the step summary, uploads the timings, and on a red run opens (or
# comments on) a "Nightly perf run failed" issue. P-04's reference workload (`python -m
# perf.lite_smoke`, 30 minutes on a compose stack) is run by hand and its report committed;
# p04-expiry.yml opens a reminder issue 14 days before that report expires (#283).
#
# The weekly scale suite (#153, docs/04 P-01, P-02, P-06; NFR-PERF-1,2, NFR-SCALE-1) runs every
# Sunday at 03:00 UTC, on the GitHub-hosted runner, which hosts the performance suites by the
# owner's round-one decision on #153. Every number it publishes is labelled `github-runner (not
# the reference host)`. `weekly` builds the scale fixture (50k memories, 100k events; cached as
# a pg_dump keyed by the alembic head, the builder's source hash and the spec) and runs the
# `perf_weekly` tests, the only tests that gate on wall-clock budgets. A budget miss turns it
# red and files (or comments on) a "Weekly perf run failed" issue. `weekly-docs` then renders
# docs/perf.md and docs/capacity.md from the results, red or green, and opens or updates the
# rolling `perf/weekly` pull request (label `performance`) for the owner's review.
name: Perf

on:
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      suite:
        description: nightly (P-03) or weekly (the scale suite and its docs PR)
        type: choice
        options:
          - nightly
          - weekly
        default: nightly

permissions:
  contents: read

# One perf run at a time; a run in progress is never cancelled (its issue step must run).
concurrency:
  group: perf
  cancel-in-progress: false

env:
  # The gate's uv (ci.yml), so the perf run tests the toolchain the merge gate uses.
  UV_VERSION: "0.12.23"

jobs:
  perf:
    if: github.event.schedule == '0 3 * * *' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'nightly')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0  # exact: setup-uv publishes no floating major tag past v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
      # pytest-benchmark is in the dev group (PR CI runs the quick subset with it).
      - run: uv sync --frozen
      # Integration fixtures start pgvector/pgvector:pg16 through testcontainers on the runner's
      # Docker. P-03 writes its figures to build/perf/p_03_<events>_events.json.
      - name: P-03 commit latency
        id: perf
        run: |
          mkdir -p build/perf
          set -o pipefail
          uv run pytest tests/perf/test_p_03.py -m "perf_quick or perf_long" -s -rA --benchmark-json=build/perf/benchmark.json --junitxml=build/perf/junit.xml 2>&1 | tee build/perf/perf.log
      - name: Summarise
        if: always()
        env:
          OUTCOME: ${{ steps.perf.outcome }}
        run: |
          {
            printf '%s\n' "## Nightly perf run: $OUTCOME" '' 'P-03 (budget: p95 <= 250 ms, no commit over 2 s):' '' '```'
            grep -E '^P-03 commit latency' build/perf/perf.log || printf '%s\n' '(no figures printed)'
            printf '%s\n' '```' '' '```'
            grep -E '^(FAILED|ERROR|PASSED) |[0-9]+ (passed|failed)' build/perf/perf.log | tail -20 || true
            printf '%s\n' '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-results
          path: build/perf/
          if-no-files-found: warn
      - name: Report a red run
        if: failure() && steps.perf.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed=$(grep -E '^(FAILED|ERROR) ' build/perf/perf.log | head -20 || true)
          figures=$(grep -E '^P-03 commit latency' build/perf/perf.log || true)
          body=$(printf '%s\n' "The nightly perf run failed: $RUN_URL" '' 'Failed:' '```' "$failed" '```' '' 'Figures:' '```' "$figures" '```')
          open=$(gh issue list --state open --search 'in:title "Nightly perf run failed"' --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "Nightly perf run failed $(date -u +%F)" --label bug --label needs-triage --body "$body"
          fi

  weekly:
    if: github.event.schedule == '0 3 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'weekly')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      issues: write
    env:
      EPISTREL_TEST_PERF_HOST: github-runner
      EPISTREL_TEST_PERF_CACHE_DIR: ${{ github.workspace }}/build/scale-cache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0  # exact: setup-uv publishes no floating major tag past v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen
      # The dumps' key: the alembic head, the builder's source hash and each spec the suite
      # builds (P-01/P-02's 50k fixture, P-06's 1k start), so a schema or builder change rebuilds.
      - name: Scale fixture cache key
        id: fixture
        run: |
          key=$(uv run python -c 'from epistrel.testing.fixtures import scale; print(scale.cache_key(scale.ScaleSpec()) + "-" + scale.cache_key(scale.ScaleSpec.scaled(1_000)))')
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: build/scale-cache
          key: scale-fixture-${{ steps.fixture.outputs.key }}
      # Integration fixtures start pgvector/pgvector:pg16 through testcontainers on the runner's
      # Docker; the fixture is dumped and restored with the runner's pg_dump/pg_restore (or the
      # image's, through docker run). Each test writes build/perf/<name>.json.
      - name: Weekly scale suite
        id: weekly
        run: |
          mkdir -p build/perf
          set -o pipefail
          uv run pytest tests/perf/test_p_01.py tests/perf/test_p_02.py tests/perf/test_p_06.py -m perf_weekly -s -rA --junitxml=build/perf/weekly-junit.xml 2>&1 | tee build/perf/weekly.log
      - name: Summarise
        if: always()
        env:
          OUTCOME: ${{ steps.weekly.outcome }}
        run: |
          {
            printf '%s\n' "## Weekly perf run: $OUTCOME (host: github-runner, not the reference host)" '' '```'
            grep -E '^p_0[126]' build/perf/weekly.log | cut -c1-400 || printf '%s\n' '(no figures printed)'
            grep -E '^(FAILED|ERROR|PASSED) |[0-9]+ (passed|failed)' build/perf/weekly.log | tail -20 || true
            printf '%s\n' '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-weekly
          path: build/perf/
          if-no-files-found: warn
      - name: Report a red run
        if: failure() && steps.weekly.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed=$(grep -E '^(FAILED|ERROR) ' build/perf/weekly.log | head -20 || true)
          body=$(printf '%s\n' "The weekly perf run failed (host: github-runner, not the reference host): $RUN_URL" '' 'Failed:' '```' "$failed" '```' '' 'The figures are in the run artifact `perf-weekly` and in the weekly docs pull request.')
          open=$(gh issue list --state open --search 'in:title "Weekly perf run failed"' --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "Weekly perf run failed $(date -u +%F)" --label bug --label needs-triage --label performance --body "$body"
          fi

  weekly-docs:
    needs: weekly
    if: always() && (needs.weekly.result == 'success' || needs.weekly.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0  # exact: setup-uv publishes no floating major tag past v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/download-artifact@v8
        with:
          name: perf-weekly
          path: build/perf
      - name: Render docs/perf.md and docs/capacity.md
        run: uv run python -m epistrel.tools.perf_docs --results build/perf --docs docs
      # One rolling branch; a budget miss still opens the PR with the failing numbers (the
      # `weekly` job has filed its issue). The PR is the owner's to review and merge.
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: perf/weekly
          add-paths: |
            docs/perf.md
            docs/capacity.md
          commit-message: "docs: the weekly performance measurements (github-runner) (#153)"
          title: "docs: weekly performance measurements (github-runner, not the reference host)"
          labels: performance
          body: |
            The weekly scale suite's measurements (P-01, P-02, P-06 and #147's retirement spike),
            rendered by `python -m epistrel.tools.perf_docs` (#153). Host: github-runner (not the
            reference host). Suite result: ${{ needs.weekly.result }}. Run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            A pull request opened with the workflow's token does not start `ci.yml`: close and
            reopen it (or push to the branch) to run the gate before merging.
