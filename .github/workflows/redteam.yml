# The nightly red-team run (#145, docs/04 §10): R-01's full poisoning-loop corpus (20
# plant-then-extract sequences, `redteam_long`) beside the PR subset (`redteam`, which PR CI
# also runs), and PRIV's extended property run (#170: 5,000 examples). Each sequence gates
# itself (it terminates within the polish budget and never emits its canary), so a regression
# turns this run red; the run reports in the step summary, uploads the log, and on a red run
# opens (or comments on) a "Nightly red-team run failed" issue.
name: Red team

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One red-team run at a time; a run in progress is never cancelled (its issue step must run).
concurrency:
  group: redteam
  cancel-in-progress: false

env:
  # The gate's uv (ci.yml), so the red-team run tests the toolchain the merge gate uses.
  UV_VERSION: "0.12.23"

jobs:
  redteam:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0  # exact: setup-uv publishes no floating major tag past v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen
      # Integration fixtures start pgvector/pgvector:pg16 through testcontainers on the runner's
      # Docker.
      - name: Red-team corpora
        id: redteam
        run: |
          mkdir -p build/redteam
          set -o pipefail
          uv run pytest tests/redteam -m "redteam or redteam_long" -rA --junitxml=build/redteam/junit.xml 2>&1 | tee build/redteam/redteam.log
      # #170: PRIV (the context half, tests/property/test_priv.py) at 5,000 Hypothesis
      # examples; PR CI runs the same property at 500.
      - name: PRIV extended
        id: priv
        if: always()
        env:
          EPISTREL_HYPOTHESIS_PROFILE: nightly
        run: |
          mkdir -p build/redteam
          set -o pipefail
          uv run pytest tests/property/test_priv.py -rA 2>&1 | tee build/redteam/priv.log
      - name: Summarise
        if: always()
        env:
          OUTCOME: ${{ steps.redteam.outcome }}
          PRIV: ${{ steps.priv.outcome }}
        run: |
          {
            printf '%s\n' "## Nightly red-team run: $OUTCOME (PRIV extended: $PRIV)" '' '```'
            grep -E '^(FAILED|ERROR|PASSED) |[0-9]+ (passed|failed)' build/redteam/redteam.log build/redteam/priv.log | tail -30 || true
            printf '%s\n' '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: redteam-results
          path: build/redteam/
          if-no-files-found: warn
      - name: Report a red run
        if: failure() && (steps.redteam.outcome == 'failure' || steps.priv.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed=$(grep -hE '^(FAILED|ERROR) ' build/redteam/redteam.log build/redteam/priv.log | head -20 || true)
          body=$(printf '%s\n' "The nightly red-team run failed: $RUN_URL" '' 'Failed:' '```' "$failed" '```')
          open=$(gh issue list --state open --search 'in:title "Nightly red-team run failed"' --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "Nightly red-team run failed $(date -u +%F)" --label bug --label needs-triage --body "$body"
          fi
